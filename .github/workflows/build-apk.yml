name: Build fatzGPT APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'fatzGPT/fatzgpt_starter/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: fatzGPT/fatzgpt_starter
        run: flutter create . --platforms=android

      - name: Install dependencies
        working-directory: fatzGPT/fatzgpt_starter
        run: flutter pub get

      - name: Build APK
        working-directory: fatzGPT/fatzgpt_starter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fatzGPT-Android
          path: fatzGPT/fatzgpt_starter/build/app/outputs/flutter-apk/app-release.apk
