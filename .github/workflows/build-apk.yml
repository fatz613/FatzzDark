
name: Build Fatzz APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FatzzDark-Android-Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          unzip -q FatzzDark-Android-Source.zip -d source

      - name: Build APK
        run: |
          gradle --no-daemon -p source/FatzzDark clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fatzz-Debug-APK
          path: source/FatzzDark/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
